# Reverse proxy for the Next.js frontend container (see ../docker-compose.yml, service
# "frontend", published on 127.0.0.1:3002). Not deployed automatically - copy to
# /etc/nginx/sites-available/guentours-frontend on the VPS, symlink into sites-enabled, then run
# `sudo certbot --nginx -d guenstravelandtours.com -d www.guenstravelandtours.com` to add HTTPS -
# certbot rewrites this file in place to add the certificate paths and the HTTP->HTTPS redirect.
#
# Domain guessed from the hardcoded contact email in frontend/src/components/site-footer.tsx
# (info@guenstravelandtours.com) - replace guenstravelandtours.com below if that's wrong.

server {
    listen 80;
    listen [::]:80;
    server_name guenstravelandtours.com www.guenstravelandtours.com;

    # Real client IP/host/scheme for the app's own trusted-proxy logic (see
    # frontend/src/lib/site-url.ts and RateLimitFilter.java's identical comment on the API side) -
    # without these, sitemap.xml/robots.txt/rate-limiting would see this Nginx box's own address
    # instead of the actual visitor's.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://127.0.0.1:3002;
    }

    # Next.js's own static asset bundle is content-hashed and safe to cache aggressively -
    # noticeably cuts load on the frontend container for repeat visits.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
