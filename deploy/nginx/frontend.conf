# Reverse proxy for the Next.js frontend container (see ../docker-compose.yml, service
# "frontend", published on 127.0.0.1:3002). Not deployed automatically - copy to
# /etc/nginx/sites-available/guentours-frontend on the VPS, symlink into sites-enabled, then run
# `sudo certbot --nginx -d guenstravel.com -d www.guenstravel.com` to add HTTPS - certbot rewrites
# this file in place to add the certificate paths and the HTTP->HTTPS redirect.
#
# www.guenstravel.com is redirected (301) to the apex instead of being served directly: the two
# are different CORS origins even though they're the same "site" for cookies, and the backend's
# APP_CORS_ALLOWED_ORIGINS only helps if every visitor actually lands on a domain that's in that
# list. Canonicalizing to one hostname here means the app never has to worry about which variant
# a visitor typed/was linked to - confirmed as the cause of a real prod bug (2026-08-31): API calls
# made from https://www.guenstravel.com got a CORS-rejected, empty-body 403 from Spring's
# CorsFilter because the origin list check didn't line up, breaking notifications/SSE and likely
# other calls too, depending on which hostname a given session happened to load first.
server {
    listen 80;
    listen [::]:80;
    server_name www.guenstravel.com;
    return 301 https://guenstravel.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name guenstravel.com;

    # Real client IP/host/scheme for the app's own trusted-proxy logic (see
    # frontend/src/lib/site-url.ts and RateLimitFilter.java's identical comment on the API side) -
    # without these, sitemap.xml/robots.txt/rate-limiting would see this Nginx box's own address
    # instead of the actual visitor's.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Next.js's i18n middleware (next-intl) echoes the full incoming URL back in the
    # `x-middleware-rewrite` response header (e.g. /checkout?...&detail=<url-encoded JSON> becomes
    # /fr/checkout?...&detail=<same JSON>) - the flight-detail checkout summary can put several KB
    # of JSON in that query string for a multi-segment/multi-city itinerary. Combined with the CSP
    # and hreflang `link` headers, that response header block can exceed nginx's default proxy
    # buffer (4-8k), which makes nginx log "upstream sent too big header while reading response
    # header from upstream" and return 502 - confirmed as the cause of a real prod 502 on
    # /checkout (2026-09-01). Sized generously above what even a several-leg multi-city itinerary
    # needs.
    proxy_buffer_size       32k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3002;
    }

    # Next.js's own static asset bundle is content-hashed and safe to cache aggressively -
    # noticeably cuts load on the frontend container for repeat visits.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
