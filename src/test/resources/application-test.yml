spring:
  datasource:
    url: jdbc:h2:mem:guentours;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Flyway's migrations are written for MySQL; tests keep using Hibernate's own fast,
  # auto-generated H2 schema above instead of replaying them against a different dialect.
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    # Explicit blanks so a developer's real SMTP creds in their local .env never leak into
    # the test relay (GreenMail here doesn't expect AUTH).
    username:
    password:

app:
  providers:
    # `enabled` must be pinned here too, not just `mock-mode` - application.yml's own defaults
    # (${TRAVELOPRO_ENABLED:true} etc.) only apply when nothing else sets the property, and
    # spring-dotenv loads the repo-root .env as a real PropertySource regardless of active
    # profile. A developer's local .env disabling a provider for their own manual testing (e.g.
    # TRAVELOPRO_ENABLED=false) would otherwise silently disable it here too, making hotel/flight
    # search tests pass or fail depending on whose machine they run on instead of what's tested.
    travelopro:
      enabled: true
      mock-mode: true
    sabre:
      enabled: true
      mock-mode: true
    travelport:
      enabled: true
      mock-mode: true
    travelterminus:
      enabled: true
      mock-mode: true

  reference-data:
    # Keep the recurring sync from firing mid-test and racing with tests that trigger it directly.
    sync-interval-ms: 999999999999
    sync-initial-delay-ms: 999999999999

  # Every MockMvc request in the suite shares the same simulated remote address, so a shared
  # in-memory bucket would see far more than a real client's traffic and start rejecting
  # legitimate test requests - not what's under test here, so it's off for the whole suite.
  rate-limit:
    enabled: false
