global:
  scrape_interval: 15s

scrape_configs:
  - job_name: guentours-api
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      # 'api' is the actual service name on the server's docker-compose (container_name
      # guestravel-api) - not 'spring', which only matches this repo's own stale docker-compose.yml.
      - targets: ["api:8080"]
    # /actuator/prometheus requires the ADMIN role (see SecurityConfig) - authenticates over HTTP
    # Basic against the same user database as the app's own login, not a separate credential
    # store. Real credentials go in the gitignored monitoring/prometheus_admin.txt (copy
    # monitoring/prometheus_admin.txt.example and fill it in), never in this file directly.
    basic_auth:
      username: "admin@example.com"
      password_file: /etc/prometheus/prometheus_admin.txt
