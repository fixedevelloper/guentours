name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  docker:

    runs-on: ubuntu-latest

    environment: production

    steps:

      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guestravel-api:latest
            ghcr.io/${{ github.repository_owner }}/guestravel-api:${{ github.sha }}

      - name: Build and Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guestravel-frontend:latest
            ghcr.io/${{ github.repository_owner }}/guestravel-frontend:${{ github.sha }}
          # NEXT_PUBLIC_* are inlined into the client JS bundle by `next build` itself - a runtime
          # container env var has no effect (see frontend/Dockerfile's ARG/ENV block), so the real
          # values must be supplied here as build args. Sourced from Actions Variables since none
          # of these are actually secret (a Stripe *publishable* key and two public URLs are meant
          # to ship inside the browser bundle) - set them under Settings > Environments >
          # production > Variables.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Debug host
        run: |
         echo "Host:"
         echo "${{ secrets.SERVER_HOST }}"
           echo "${{ secrets.SERVER_PORT }}"

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            echo "Connexion VPS OK"

            docker login ghcr.io \
              -u ${{ github.actor }} \
              -p ${{ secrets.GITHUB_TOKEN }}

            cd /opt/apps

            docker compose pull

            docker compose up -d

            docker image prune -f